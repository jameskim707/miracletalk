<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#4f46e5">
  <title>미라클톡</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">
    <!-- 로딩 / 설정 안내 -->
    <section id="loading-screen" class="screen center">
      <p id="loading-text">불러오는 중...</p>
    </section>

    <!-- 로그인 화면 -->
    <section id="login-screen" class="screen center hidden">
      <div class="login-box">
        <img src="icons/icon-192.png" class="logo" alt="미라클톡 로고">
        <h1>미라클톡</h1>
        <p class="tagline">이어지는 대화, 따뜻한 연결</p>
        <button id="btn-login" class="btn-primary">Google 계정으로 시작하기</button>
        <p id="login-error" class="error"></p>
      </div>
    </section>

    <!-- 메인 화면: 친구 / 채팅 탭 -->
    <section id="main-screen" class="screen hidden">
      <header class="chat-header">
        <div class="room-title" id="main-title">채팅</div>
        <div class="me">
          <span id="me-name"></span>
          <button id="btn-logout" class="btn-ghost">로그아웃</button>
        </div>
      </header>

      <!-- 채팅 탭 -->
      <main id="tab-chats" class="tab-panel">
        <div class="list-actions">
          <button type="button" id="btn-new-group" class="btn-ghost">+ 새 단체방</button>
        </div>
        <ul id="room-list" class="list"></ul>
      </main>

      <!-- 친구 탭 -->
      <main id="tab-friends" class="tab-panel hidden">
        <div id="my-card" class="my-card"></div>

        <form id="add-friend" class="add-friend">
          <input id="friend-email" type="email" placeholder="친구의 구글 이메일" autocomplete="off" required>
          <button type="submit" id="btn-add-friend" class="btn-primary">추가</button>
        </form>
        <p id="friend-msg" class="hint"></p>

        <div class="section-label">친구 <span id="friend-count"></span></div>
        <ul id="friend-list" class="list"></ul>
      </main>

      <nav class="tabbar">
        <button type="button" class="tab" data-tab="friends">친구</button>
        <button type="button" class="tab active" data-tab="chats">채팅</button>
      </nav>
    </section>

    <!-- 대화 화면 -->
    <section id="chat-screen" class="screen hidden">
      <header class="chat-header">
        <div class="header-left">
          <button id="btn-back" class="btn-back" aria-label="뒤로">‹</button>
          <div class="room-title" id="room-title">채팅방</div>
        </div>
        <div class="header-right">
          <span id="room-me" class="room-me"></span>
          <button type="button" id="btn-invite" class="btn-ghost small hidden">초대</button>
          <button type="button" id="btn-leave" class="btn-ghost small hidden">나가기</button>
        </div>
      </header>

      <main id="messages" class="messages" aria-live="polite"></main>

      <form id="composer" class="composer">
        <textarea id="input" rows="1" maxlength="1000" placeholder="메시지를 입력하세요"></textarea>
        <button type="submit" id="btn-send" class="btn-primary">전송</button>
      </form>
    </section>
  </div>

  <!-- 3단계: 단체방 만들기 / 초대하기 (친구 고르기 창) -->
  <div id="picker" class="overlay hidden" role="dialog" aria-modal="true" aria-labelledby="picker-title">
    <div class="sheet">
      <header class="sheet-header">
        <button type="button" id="picker-close" class="btn-back" aria-label="닫기">‹</button>
        <div class="room-title" id="picker-title">새 단체방</div>
      </header>
      <div id="picker-name-wrap" class="picker-name">
        <input id="picker-name" type="text" maxlength="30" placeholder="방 이름 (예: 가족방, 스터디)" autocomplete="off">
      </div>
      <div class="section-label">친구 선택 <span id="picker-count"></span></div>
      <ul id="picker-list" class="list sheet-list"></ul>
      <p id="picker-msg" class="hint"></p>
      <div class="sheet-footer">
        <button type="button" id="picker-ok" class="btn-primary" disabled>만들기</button>
      </div>
    </div>
  </div>

  <script type="module" src="app.js"></script>
</body>
</html>
